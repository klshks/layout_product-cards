<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="card-content"
      data-qa="card"
    >
      <div class="card-content__image">
        <img
          src="./images/imac.jpeg"
          alt="mac image"
        />
      </div>
      <h3 class="card-content__title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h3>
      <p class="card-content__code">Product code: 195434</p>
      <div class="card-content__rating">
        <div class="stars stars--4">
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
        </div>
        <span class="card-content__rating-reviews">Reviews: 5</span>
      </div>
      <div class="card-content__price">
        <span class="card-content__price-label">Price:</span>
        <span class="card-content__price-value">$2,199</span>
      </div>
      <button
        class="card-content__button"
        data-qa="hover"
      >
        BUY
      </button>
    </div>
  </body>
</html>
